[mcu hotkey]
serial: /dev/serial/by-id/change-me-to-the-correct-mcu-path
restart_method: command

[include config/mcu_definitions/expander/Fysetc_Hotkey.cfg]
[board_pins hotkey_mcu]
mcu: hotkey
aliases:
    HOTKEY_LED=MCU_LED,
    HOTKEY_B1=MCU_B1, HOTKEY_B2=MCU_B2, HOTKEY_B3=MCU_B3, HOTKEY_B4=MCU_B4,
    HOTKEY_B5=MCU_B5, HOTKEY_B6=MCU_B6, HOTKEY_B7=MCU_B7, HOTKEY_B8=MCU_B8,
    HOTKEY_B9=MCU_B9, HOTKEY_B10=MCU_B10, HOTKEY_B11=MCU_B11, HOTKEY_B12=MCU_B12,

[neopixel hotkey_leds]
pin: hotkey:HOTKEY_LED
chain_count: 24
color_order: GRB
initial_RED: 0.1
initial_GREEN: 0.1
initial_BLUE: 0.1

[gcode_macro _USER_VARIABLES]
variable_button_led_name: "hotkey_leds"
variable_button_led_indices: {
        '1': '1,2', '2': '3,4', '3': '5,6', '4': '7,8',
        '5': '9,10', '6': '11,12', '7': '13,14', '8': '15,16',
        '9': '17,18', '10': '19,20', '11': '21,22', '12': '23,24'
    }
gcode:

[gcode_button b1]
pin: ^!hotkey:HOTKEY_B1
press_gcode: _HOTKEY_BUTTON BUTTON=B1

[gcode_button b2]
pin: ^!hotkey:HOTKEY_B2
press_gcode: _HOTKEY_BUTTON BUTTON=B2

[gcode_button b3]
pin: ^!hotkey:HOTKEY_B3
press_gcode: _HOTKEY_BUTTON BUTTON=B3

[gcode_button b4]
pin: ^!hotkey:HOTKEY_B4
press_gcode: _HOTKEY_BUTTON BUTTON=B4

[gcode_button b5]
pin: ^!hotkey:HOTKEY_B5
press_gcode: _HOTKEY_BUTTON BUTTON=B5

[gcode_button b6]
pin: ^!hotkey:HOTKEY_B6
press_gcode: _HOTKEY_BUTTON BUTTON=B6

[gcode_button b7]
pin: ^!hotkey:HOTKEY_B7
press_gcode: _HOTKEY_BUTTON BUTTON=B7

[gcode_button b8]
pin: ^!hotkey:HOTKEY_B8
press_gcode: _HOTKEY_BUTTON BUTTON=B8

[gcode_button b9]
pin: ^!hotkey:HOTKEY_B9
press_gcode: _HOTKEY_BUTTON BUTTON=B9

[gcode_button b10]
pin: ^!hotkey:HOTKEY_B10
press_gcode: _HOTKEY_BUTTON BUTTON=B10

[gcode_button b11]
pin: ^!hotkey:HOTKEY_B11
press_gcode: _HOTKEY_BUTTON BUTTON=B11

[gcode_button b12]
pin: ^!hotkey:HOTKEY_B12
press_gcode: _HOTKEY_BUTTON BUTTON=B12
