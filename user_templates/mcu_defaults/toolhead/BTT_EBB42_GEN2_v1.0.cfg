
#--------------------------------------------#
#### BTT EBB42 GEN2 v1.0 MCU definition ######
#--------------------------------------------#

[mcu toolhead]
##--------------------------------------------------------------------
canbus_uuid: change-me-to-the-correct-canbus-id
##--------------------------------------------------------------------

# If you want to override the wiring of the BTT EBB42 GEN2, keep in mind that this
# board is defined using the "toolhead" name. So you should use "pin: toolhead:PIN_NAME"
# in your own overrides.cfg files.

[include config/mcu_definitions/toolhead/BTT_EBB42_GEN2_v1.0.cfg] # Do not remove this line
[board_pins ebb42_gen2_mcu]
mcu: toolhead
aliases:
    E_STEP=MCU_TMCDRIVER_STEP , E_DIR=MCU_TMCDRIVER_DIR , E_ENABLE=MCU_TMCDRIVER_ENABLE , E_TMCUART=MCU_TMCDRIVER_UART ,

    X_STOP=MCU_ENDSTOP ,
    PROBE_INPUT=MCU_PROBE ,
    TOOLHEAD_SENSOR=MCU_FILAMENT_SENSOR ,

    E_HEATER=MCU_HOTEND0 , E_TEMPERATURE=MCU_TH0 ,
    TOOLHEAD_TEMPERATURE=MCU_BOARD_TEMP ,

    PART_FAN=MCU_FAN1 , E_FAN=MCU_FAN3 , E_FAN_TACHO=MCU_FAN3_TACH ,
    AUX_FAN=MCU_FAN2 ,

    STATUS_NEOPIXEL=MCU_RGB ,

    LIS2DW_CS=MCU_SPI2_CS ,


#----------------------------------------#
#    BTT EBB42 GEN2 v1.0 pins remapping  #
#----------------------------------------#

# These pins overrides are automatically added when you select a CANbus
# toolhead MCU during the installation process. They should provide a
# good base to work with. Feel free to adapt to your board if needed!

[extruder]
step_pin: toolhead:E_STEP
dir_pin: toolhead:E_DIR
enable_pin: !toolhead:E_ENABLE
heater_pin: toolhead:E_HEATER
sensor_pin: toolhead:E_TEMPERATURE
pullup_resistor: 2200

[probe]
pin: ^toolhead:PROBE_INPUT

[fan]
pin: toolhead:PART_FAN

## To use PART_FAN and AUX_FAN together as the part cooling fan,
## replace the [fan] section above with the following:
# [multi_pin dual_part_fan]
# pins: toolhead:PART_FAN,toolhead:AUX_FAN
#
# [fan]
# pin: multi_pin:dual_part_fan

[heater_fan hotend_fan]
pin: toolhead:E_FAN

## Uncomment the following line if not using sensorless homing
## and having the X endstop plugged to the toolhead MCU
# [stepper_x]
# endstop_pin: ^toolhead:X_STOP

[neopixel status_leds]
pin: toolhead:STATUS_NEOPIXEL

[tmc2209 extruder]
uart_pin: toolhead:E_TMCUART

[temperature_sensor ebb42_gen2_temp]
sensor_type: Generic 3950
sensor_pin: toolhead:TOOLHEAD_TEMPERATURE
pullup_resistor: 2200
