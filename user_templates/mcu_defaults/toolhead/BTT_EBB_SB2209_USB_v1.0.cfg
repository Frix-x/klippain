
#-----------------------------------------------------#
#### BTT EBB SB2209 USB v1.0 MCU definition ###########
#-----------------------------------------------------#

[mcu toolhead]
##--------------------------------------------------------------------
serial: /dev/serial/by-id/change-me-to-the-correct-mcu-path
##--------------------------------------------------------------------

# If you want to override the wiring of the BTT EBB SB2209 USB, keep in mind that this
# board is defined using the "toolhead" name. So you should use "pin: toolhead:PIN_NAME"
# in your own overrides.cfg files.

[include config/mcu_definitions/toolhead/BTT_EBB_SB2209_USB_v1.0.cfg] # Do not remove this line
[board_pins ebb_sb2209_usb_mcu]
mcu: toolhead
aliases:
    E_STEP=MCU_E0_STEP , E_DIR=MCU_E0_DIR , E_ENABLE=MCU_E0_EN , E_TMCUART=MCU_E0_UART ,

    X_STOP=MCU_ENDSTOP ,
    PROBE_INPUT=MCU_PROBE ,
    BLTOUCH_SENSOR=MCU_BLTOUCH_SENSOR , BLTOUCH_CONTROL=MCU_BLTOUCH_CONTROL ,

    E_HEATER=MCU_HE0 , E_TEMPERATURE=MCU_TH0 ,
    TOOLHEAD_TEMPERATURE=MCU_BOARD_TEMP ,

    PART_FAN=MCU_FAN1_PWM , E_FAN=MCU_FAN2_PWM ,
    AUX_FAN=MCU_FAN3_PWM ,
    AUX_FAN_4W=MCU_4WFAN_PWM , AUX_FAN_4W_TACH=MCU_4WFAN_TACH ,

    STATUS_NEOPIXEL=MCU_RGB ,
    STATUS_BOARD=MCU_LED ,

    LIS2DW_CS=MCU_LIS2DW_CS , LIS2DW_INT1=MCU_LIS2DW_INT1 ,

    ## I2C header
    I2C_SCL=MCU_I2C_SCL , I2C_SDA=MCU_I2C_SDA ,


#--------------------------------------------------#
#    BTT EBB SB2209 USB v1.0 pins remapping        #
#--------------------------------------------------#

# These pins overrides are automatically added when you select a USB
# toolhead MCU during the installation process. They should provide a
# good base to work with. Feel free to adapt to your board if needed!

[extruder]
step_pin: toolhead:E_STEP
dir_pin: !toolhead:E_DIR
enable_pin: !toolhead:E_ENABLE
heater_pin: toolhead:E_HEATER
sensor_pin: toolhead:E_TEMPERATURE
pullup_resistor: 2200

[probe]
pin: ^toolhead:PROBE_INPUT

[fan]
pin: toolhead:PART_FAN

[heater_fan hotend_fan]
pin: toolhead:E_FAN

## Uncomment the following line if not using sensorless homing
## and having the X endstop plugged to the toolhead MCU
# [stepper_x]
# endstop_pin: ^toolhead:X_STOP

[neopixel status_leds]
pin: toolhead:STATUS_NEOPIXEL

[tmc2209 extruder]
uart_pin: toolhead:E_TMCUART

[temperature_sensor ebb_sb2209_usb_temp]
sensor_type: Generic 3950
sensor_pin: toolhead:TOOLHEAD_TEMPERATURE
