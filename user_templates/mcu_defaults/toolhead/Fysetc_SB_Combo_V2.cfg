
#--------------------------------------------#
#### Fysetc SB Combo V2 MCU definition ######
#--------------------------------------------#

[mcu toolhead]
##--------------------------------------------------------------------
canbus_uuid: change-me-to-the-correct-canbus-id
# If using USB mode, comment out canbus_uuid above and uncomment the serial line below.
# serial: /dev/serial/by-id/change-me-to-the-correct-mcu-path
##--------------------------------------------------------------------

# If you want to override the wiring of the Fysetc SB Combo V2, keep in mind that this
# board is defined using the "toolhead" name. So you should use "pin: toolhead:PIN_NAME"
# in your own overrides.cfg files.

[include config/mcu_definitions/toolhead/Fysetc_SB_Combo_V2.cfg] # Do not remove this line

[board_pins fysetc_sb_combo_v2_mcu]
mcu: toolhead
aliases:
    E_STEP=MCU_TMCDRIVER_STEP , E_DIR=MCU_TMCDRIVER_DIR , E_ENABLE=MCU_TMCDRIVER_ENABLE , E_TMCUART=MCU_TMCDRIVER_UART ,
    E_TXPIN=MCU_TMCDRIVER_TX , E_DIAG=MCU_TMCDRIVER_DIAG ,

    X_STOP=MCU_IO0 , Y_STOP=MCU_IO1 ,
    PROBE_INPUT=MCU_PROBE ,

    E_HEATER=MCU_HE0 , E_TEMPERATURE=MCU_TE0 ,

    PART_FAN=MCU_FAN0_PWM , E_FAN=MCU_FAN1_PWM , AUX_FAN=MCU_FAN2_PWM ,

    STATUS_NEOPIXEL=MCU_RGB , STATUS_BOARD=MCU_STATUS ,

    ADXL_CS=MCU_ADXL345_CSPIN , ADXL_SCLK=MCU_ADXL345_CLK , ADXL_MISO=MCU_ADXL345_MISO , ADXL_MOSI=MCU_ADXL345_MOSI ,

    FIVE_VOLT_MONITOR=MCU_5V_MONITOR , VIN_MONITOR=MCU_24V_MONITOR ,
    DRIVER_TEMPERATURE=MCU_TMC_THERMISTOR ,

    AUX_FAN0=MCU_AUX_FAN0 , AUX_FAN0_TACHO=MCU_AUX_IO5 ,
    AUX_FAN1=MCU_AUX_FAN1 , AUX_FAN1_TACHO=MCU_AUX_IO6 ,
    AUX_RGB=MCU_AUX_RGB ,


#----------------------------------------#
#  Fysetc SB Combo V2 pins remapping     #
#----------------------------------------#

# These pins overrides are automatically added when you select a CANbus
# toolhead MCU during the installation process. They should provide a
# good base to work with. Feel free to adapt to your board if needed!

[extruder]
step_pin: toolhead:E_STEP
dir_pin: toolhead:E_DIR
enable_pin: !toolhead:E_ENABLE
heater_pin: toolhead:E_HEATER
sensor_pin: toolhead:E_TEMPERATURE

[tmc2209 extruder]
uart_pin: toolhead:E_TMCUART
tx_pin: toolhead:E_TXPIN

[probe]
pin: ^toolhead:PROBE_INPUT

[fan]
pin: toolhead:PART_FAN

[heater_fan hotend_fan]
pin: toolhead:E_FAN

## Uncomment the following line if not using sensorless homing
## and having the X endstop plugged to IO.0 on the toolhead MCU
# [stepper_x]
# endstop_pin: ^toolhead:X_STOP

## Uncomment the following line if not using sensorless homing
## and having the Y endstop plugged to IO.1 on the toolhead MCU
# [stepper_y]
# endstop_pin: ^toolhead:Y_STOP

[neopixel status_leds]
pin: toolhead:STATUS_NEOPIXEL

[temperature_sensor toolhead_mcu]
sensor_type: temperature_mcu
sensor_mcu: toolhead

[output_pin activity_led]
pin: toolhead:STATUS_BOARD
