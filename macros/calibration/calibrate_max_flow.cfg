#########################################
######## MAX FLOW CALIBRATION ###########
#########################################
# @version: 0.1 (draft)

# CHANGELOG:
#   v0.1: first draft of a max volumetric flow calibration macro

### What is it ? ###
# Prints a vase mode "comb" (3 teeth) where the volumetric flow is ramped up in steps as the print grows taller.
# The shape and the 2mm grooves are inspired by this test: https://www.printables.com/model/342075-extrusion-test-structure
# Each groove on the flat side of the part marks the start of a new flow band (one more FLOW_STEP).
# Count the grooves below the first defect (under extrusion, clicking, rough or skipped layers) and
# call COMPUTE_MAX_FLOW GROOVES=xx to get the maximum flow your hotend can sustain.

# The part is continuous (a spiral, like a slicer vase mode) with a brim for the adhesion. The brim and the first
# layer (0.2mm) are slow, then the spiral follows the flow ramp from the second layer. It uses the same layer height
# (0.35mm) and extrusion width (0.7mm) as the original test, but the speed is computed directly from the wanted flow.

# NOTE: this macro uses G2/G3 arcs, so a [gcode_arcs] section must be present in the Klipper config. It can't be
# defined here (the section may already exist elsewhere), so the macro only checks that it is enabled.
# The part is printed at its full size (180x100mm) and only scaled down when the bed is too small to fit it.


# ===========================================================================================================
# DO NOT MODIFY THOSE VARIABLES (they are used internaly by the max flow calibration macro)
[gcode_macro _MAX_FLOW_CALIB_VARIABLES]
variable_last_start_flow: 0.0
variable_last_flow_step: 0.0
variable_last_bands: 0
gcode:


[gcode_macro MAX_FLOW_CALIBRATION]
description: Print a vase mode comb with stepped volumetric flow to find the max flow of the hotend
gcode:
    #
    # PARAMETERS
    #
    {% set q_start = params.START_FLOW|default(12.0)|float %} # first flow in mm3/s
    {% set q_end = params.END_FLOW|default(24.0)|float %} # last flow in mm3/s
    {% set bands_param = params.BANDS|default(13)|int %} # number of flow bands (the height is 2mm per band, 13 is like the original test)
    {% if bands_param < 2 %}
        {action_raise_error("BANDS must be at least 2")}
    {% endif %}
    {% set q_step = (q_end - q_start) / (bands_param - 1) %} # flow increase for each groove in mm3/s

    # same layer height and extrusion width as the original test
    {% set layer_height = params.LAYER_HEIGHT|default(0.35)|float %} # layer height of the spiral
    {% set extrusion_width = params.EXTRUSION_WIDTH|default(0.7)|float %}
    {% set first_layer_height = params.FIRST_LAYER_HEIGHT|default(0.2)|float %} # height of the brim and of the first layer
    {% set filament_diameter = params.FILAMENT_DIAMETER|default(1.75)|float %}

    {% set brim_loops = params.BRIM_LOOPS|default(10)|int %} # number of brim loops around the part (0 to disable)
    {% set first_layer_speed = params.FIRST_LAYER_SPEED|default(30)|float %} # speed of the brim and first layer in mm/s
    {% set groove_depth = params.GROOVE_DEPTH|default(0.2)|float %} # depth of the grooves in mm (0 to disable)
    {% set fan_speed = params.FAN_SPEED|default(50)|int %} # part cooling fan speed in percent (0-100)
    {% set accel = params.ACCEL|default(0)|float %} # optional acceleration override during the test (0 = unchanged)
    {% set scale_param = params.SCALE|default(0)|float %} # optional scale of the part (0 = automatic to fit the bed)

    {% set retract_length = params.RETRACT_LENGTH|default(0.5)|float %}
    {% set initial_purge = params.PURGE_MM|default(1)|float %} # mm of filament to purge before printing. set to 0 to disable
    {% set feedrate_travel = params.TRAVEL_SPEED|default(200)|float * 60 %}
    {% set feedrate_z = params.Z_LIFT_SPEED|default(20)|float * 60 %}
    {% set feedrate_retract = params.RETRACT_SPEED|default(50)|float * 60 %}

    #
    # CONSTANTS
    #
    {% set pi = 3.14159265 %}
    {% set band_h = 2.0 %} # height of one flow band (distance between two grooves)
    {% set win_half = 0.3 %} # half height of a groove
    {% set flat_half = [0.14, layer_height / 2]|max %} # half height of the full depth part of a groove
    {% set part_x = 180.0 %} # size of the comb at scale 1
    {% set part_y = 100.0 %}
    {% set margin = 10.0 %} # free space kept on every side of the part (brim and bed edges)

    #
    # COMPUTED VALUES
    #
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set min_x = printer.toolhead.axis_minimum.x|float %}
    {% set min_y = printer.toolhead.axis_minimum.y|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float - printer.gcode_move.homing_origin.z|float %}

    # extruded cross section (same definition as the slicers) and the resulting E per mm of path
    {% set area = (extrusion_width - layer_height) * layer_height + pi * (layer_height / 2)**2 %}
    {% set e_per_mm = area / (pi * (filament_diameter / 2)**2) %}

    # same thing for the brim and first layer, which have their own height. The brim lines are also spaced accordingly
    {% set area_first = (extrusion_width - first_layer_height) * first_layer_height + pi * (first_layer_height / 2)**2 %}
    {% set e_per_mm_first = area_first / (pi * (filament_diameter / 2)**2) %}
    {% set spacing = extrusion_width - first_layer_height * (1 - pi / 4) %}

    {% set bands = bands_param %}
    {% set q_top = q_end %}
    {% set n_revs = ((bands * band_h - first_layer_height) / layer_height)|round(0, 'ceil')|int %}
    {% set top_z = first_layer_height + n_revs * layer_height %}
    {% set v_top = q_top / area %}

    {% set s_auto = [1.0, (max_x - min_x - 2 * margin) / part_x, (max_y - min_y - 2 * margin) / part_y]|min %}
    {% set s = scale_param if scale_param > 0 else s_auto %}
    {% set ox = (min_x + max_x) / 2 - part_x * s / 2 %}
    {% set oy = (min_y + max_y) / 2 - part_y * s / 2 %}
    {% set brim_max = ((10 * s - 1.0) / spacing)|round(0, 'floor')|int %}
    {% set brim_loops = [brim_loops, brim_max]|min %}

    #
    # SAFETY CHECKS
    #
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("Printer not homed!")}
    {% endif %}
    {% if "gcode_arcs" not in printer.configfile.settings %}
        {action_raise_error("G-code arcs (G2/G3) are not enabled in Klipper. This test needs them: add a [gcode_arcs] section to your configuration (see the Klipper documentation) and restart")}
    {% endif %}
    {% if q_end <= q_start %}
        {action_raise_error("END_FLOW must be bigger than START_FLOW")}
    {% endif %}
    {% if s < 0.3 %}
        {action_raise_error("The part would be scaled down to %.2f, which is too small to be useful" % s)}
    {% endif %}
    {% if top_z > max_z %}
        {action_raise_error("The test needs %.1fmm of Z height but only %.1fmm is available. Use fewer bands: BANDS can't be more than %d" % (top_z, max_z, ((max_z - layer_height) / band_h)|round(0, 'floor')|int))}
    {% endif %}
    {% if v_top > printer.toolhead.max_velocity|float %}
        {action_raise_error("%.1f mm3/s needs %.0f mm/s but max_velocity is %.0f mm/s. END_FLOW can't be more than %.1f for this line width and layer height" % (q_top, v_top, printer.toolhead.max_velocity|float, printer.toolhead.max_velocity|float * area))}
    {% endif %}

    #
    # STARTING...
    #
    {action_respond_info("")}
    {action_respond_info("Starting max volumetric flow calibration print")}
    {action_respond_info("This operation can not be interrupted by normal means. Hit the \"emergency stop\" button to stop it if needed")}
    {action_respond_info("")}
    {action_respond_info("Flow from %.1f to %.1f mm3/s in %d bands (+%.2f mm3/s at each groove)" % (q_start, q_top, bands, q_step))}
    {% for b in range(bands) %}
        {action_respond_info("  band %d (%d grooves below): %.1f mm3/s" % (b, b, q_start + b * q_step))}
    {% endfor %}
    {action_respond_info("Part scale: %.2f - height: %.1fmm - peak speed: %.0f mm/s" % (s, top_z, v_top))}
    {action_respond_info("Extrusion width: %.3f - layer height: %.3f (first layer: %.3f)" % (extrusion_width, layer_height, first_layer_height))}
    {% set accel_now = accel if accel > 0 else printer.toolhead.max_accel|float %}
    {% if v_top * v_top / (2 * accel_now) > 100 * s %}
        {action_respond_info("WARNING: at %.0f mm accel the top speed needs %.0f mm to reach. The last bands may not reach their full speed. Try the ACCEL parameter" % (accel_now, v_top * v_top / (2 * accel_now)))}
    {% endif %}
    {action_respond_info("")}
    {action_respond_info("Count the grooves below the first defect (under extrusion, rough surface, clicking...). Then call:")}
    {action_respond_info("COMPUTE_MAX_FLOW GROOVES=xx")}
    {action_respond_info("")}

    SAVE_GCODE_STATE NAME=STATE_MAX_FLOW_CALIBRATION
    SET_GCODE_VARIABLE MACRO=_MAX_FLOW_CALIB_VARIABLES VARIABLE=last_start_flow VALUE={q_start}
    SET_GCODE_VARIABLE MACRO=_MAX_FLOW_CALIB_VARIABLES VARIABLE=last_flow_step VALUE={q_step}
    SET_GCODE_VARIABLE MACRO=_MAX_FLOW_CALIB_VARIABLES VARIABLE=last_bands VALUE={bands}

    #
    # TOOLPATH HELPERS
    #
    # Build the comb outline in the list P for an outward offset d (used for the brim). Each element is:
    # [type, end x, end y, I, J, length] with the type being L (line), F (grooved face), CCW (G3) or CW (G2)
    # The path is a closed loop, always starting at (ox + 20s, oy - d), in the counter clockwise direction
    {% macro build_outline(P, d, ox, oy, s) %}
        {% set rt = 10 * s + d %}
        {% set rg = 10 * s - d %}
        {% set rc = 20 * s + d %}
        {% set xa = ox + 20 * s %}
        {% set xg = ox + 30 * s %}
        {% set xt = ox + 170 * s %}
        {% do P.append(['L', xt, oy - d, 0, 0, xt - xa]) %}
        {% do P.append(['CCW', xt, oy + 20 * s + d, 0, rt, pi * rt]) %}
        {% do P.append(['L', xg, oy + 20 * s + d, 0, 0, xt - xg]) %}
        {% do P.append(['CW', xg, oy + 40 * s - d, 0, rg, pi * rg]) %}
        {% do P.append(['L', xt, oy + 40 * s - d, 0, 0, xt - xg]) %}
        {% do P.append(['CCW', xt, oy + 60 * s + d, 0, rt, pi * rt]) %}
        {% do P.append(['L', xg, oy + 60 * s + d, 0, 0, xt - xg]) %}
        {% do P.append(['CW', xg, oy + 80 * s - d, 0, rg, pi * rg]) %}
        {% do P.append(['L', xt, oy + 80 * s - d, 0, 0, xt - xg]) %}
        {% do P.append(['CCW', xt, oy + 100 * s + d, 0, rt, pi * rt]) %}
        {% do P.append(['L', xa, oy + 100 * s + d, 0, 0, xt - xa]) %}
        {% do P.append(['CCW', ox - d, oy + 80 * s, 0, -rc, pi / 2 * rc]) %}
        {% do P.append(['F', ox - d, oy + 20 * s, 0, 0, 60 * s]) %}
        {% do P.append(['CCW', xa, oy - d, rc, 0, pi / 2 * rc]) %}
    {% endmacro %}

    # Print one move of the path (row r) up to the height z at the speed f in mm/s
    {% macro move(r, z, f, epm) %}
        {% if r[0] == 'CCW' %}G3{% elif r[0] == 'CW' %}G2{% else %}G1{% endif %} X{r[1]|round(3)} Y{r[2]|round(3)}{% if r[0] in ['CCW', 'CW'] %} I{r[3]|round(3)} J{r[4]|round(3)}{% endif %} Z{z|round(4)} E{(r[5] * epm)|round(5)} F{(f * 60)|round(0)|int}
    {% endmacro %}

    #
    # PRIME AND BRIM (first layer, slow)
    #
    G90
    M83
    M220 S100
    M221 S100
    {% if accel > 0 %}
        SET_VELOCITY_LIMIT ACCEL={accel}
    {% endif %}
    M106 S0

    {% set ns = namespace(cum=0.0) %}
    {% for j in range(brim_loops, -1, -1) %}
        {% set d = j * spacing %}
        {% set Q = [] %}
        { build_outline(Q, d, ox, oy, s) }
        {% if loop.first %}
            G0 Z{first_layer_height + 2} F{feedrate_z}
            G0 X{(ox + 20 * s)|round(3)} Y{(oy - d)|round(3)} F{feedrate_travel}
            G1 Z{first_layer_height} F{feedrate_z}
            {% if initial_purge > 0 %}
                G1 E{initial_purge} F300
            {% endif %}
        {% else %}
            # connect to the next brim loop without any travel
            G1 Y{(oy - d)|round(3)} E{(spacing * e_per_mm_first)|round(5)} F{(first_layer_speed * 60)|round(0)|int}
        {% endif %}
        {% for r in Q %}
            { move(r, first_layer_height, first_layer_speed, e_per_mm_first) }
        {% endfor %}
    {% endfor %}

    #
    # SPIRAL (vase mode): the speed follows the flow ramp
    #
    M106 S{(fan_speed * 255 / 100)|round|int}

    {% set P = [] %}
    { build_outline(P, 0.0, ox, oy, s) }
    {% set l_rev = namespace(v=0.0) %}
    {% for r in P %}
        {% set l_rev.v = l_rev.v + r[5] %}
    {% endfor %}

    {% for rev in range(1, n_revs + 1) %}
        {% set z0 = first_layer_height + layer_height * (rev - 1) %}
        {% set ns.cum = 0.0 %}
        {% for r in P %}
            {% set z_a = z0 + layer_height * ns.cum / l_rev.v %}
            {% set ns.cum = ns.cum + r[5] %}
            {% set z_b = z0 + layer_height * ns.cum / l_rev.v %}

            # current flow band, which changes right after each groove
            {% set band = ((z_a - win_half) / band_h)|round(0, 'floor')|int %}
            {% set band = [[band, 0]|max, bands - 1]|min %}
            {% set speed = (q_start + band * q_step) / area %}

            {% if r[0] == 'F' %}
                # grooved face: depth depends on the distance to the closest groove
                {% set k = (z_a / band_h)|round|int %}
                {% set dz = (z_a - k * band_h)|abs %}
                {% if groove_depth > 0 and k >= 1 and k <= bands - 1 and dz < win_half %}
                    {% set depth = groove_depth * ([1.0, (win_half - dz) / (win_half - flat_half)]|min) %}
                {% else %}
                    {% set depth = 0.0 %}
                {% endif %}
            {% else %}
                {% set depth = 0.0 %}
            {% endif %}

            {% if depth > 0.005 %}
                {% set lead = [3.0, 0.15 * r[5]]|min %}
                { move(['L', r[1] + depth, r[2] + r[5] - lead, 0, 0, (depth**2 + lead**2)**0.5], z_a, speed, e_per_mm) }
                { move(['L', r[1] + depth, r[2] + lead, 0, 0, r[5] - 2 * lead], z_a, speed, e_per_mm) }
                { move(['L', r[1], r[2], 0, 0, (depth**2 + lead**2)**0.5], z_b, speed, e_per_mm) }
            {% else %}
                { move(r, z_b, speed, e_per_mm) }
            {% endif %}
        {% endfor %}
    {% endfor %}

    #
    # retract and move away
    #
    M106 S0
    G1 E-{retract_length} F{feedrate_retract}
    G91
    G0 Z{[[10, max_z - top_z]|min, 0]|max|round(2)} F{feedrate_z}
    {% if accel > 0 %}
        SET_VELOCITY_LIMIT ACCEL={printer.toolhead.max_accel}
    {% endif %}

    RESTORE_GCODE_STATE NAME=STATE_MAX_FLOW_CALIBRATION


[gcode_macro COMPUTE_MAX_FLOW]
description: Compute the max volumetric flow from the number of grooves below the first defect of the test print
gcode:
    {% set grooves = params.GROOVES|default(-1)|int %}
    {% set q_start = printer["gcode_macro _MAX_FLOW_CALIB_VARIABLES"].last_start_flow|float %}
    {% set q_step = printer["gcode_macro _MAX_FLOW_CALIB_VARIABLES"].last_flow_step|float %}
    {% set bands = printer["gcode_macro _MAX_FLOW_CALIB_VARIABLES"].last_bands|int %}

    {% if q_step <= 0 %}
        {action_raise_error("No max flow calibration print found! Run MAX_FLOW_CALIBRATION first")}
    {% elif grooves < 0 %}
        {action_respond_info("Please call this macro with the number of grooves below the first defect: COMPUTE_MAX_FLOW GROOVES=xx")}
    {% elif grooves == 0 %}
        {action_respond_info("The defects started in the first band (before the first groove): your max flow is below %.1f mm3/s. Rerun the test with a lower START_FLOW" % q_start)}
    {% elif grooves >= bands %}
        {action_respond_info("No defect found: your max flow is at least %.1f mm3/s. Rerun the test with a higher END_FLOW" % (q_start + (bands - 1) * q_step))}
    {% else %}
        {% set q_max = q_start + (grooves - 1) * q_step %}
        {action_respond_info("")}
        {action_respond_info("The last good band was printed at %.1f mm3/s" % q_max)}
        {action_respond_info("A safe max volumetric speed for this filament and temperature is about %.1f mm3/s (10%% margin)" % (q_max * 0.9))}
        {action_respond_info("")}
    {% endif %}
