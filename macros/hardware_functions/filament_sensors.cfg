[gcode_macro _KLIPPAIN_FILAMENT_SENSOR_STATE]
variable_disable_depth: 0
variable_enabled_before_disable: ""
gcode: # do not remove this line


[gcode_macro _KLIPPAIN_SET_FILAMENT_SENSORS]
description: Enable or disable all configured Klippain filament sensors
gcode:
    {% if params.ENABLE is not defined %}
        { action_raise_error("_KLIPPAIN_SET_FILAMENT_SENSORS requires ENABLE=0 or ENABLE=1") }
    {% endif %}
    {% set enable = params.ENABLE|int %}
    {% if enable not in [0, 1] %}
        { action_raise_error("_KLIPPAIN_SET_FILAMENT_SENSORS ENABLE must be 0 or 1") }
    {% endif %}

    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    {% set raw_sensor_names = vars.filament_sensor_names|default(["runout_sensor"]) %}
    {% set sensor_names = [raw_sensor_names] if raw_sensor_names is string else raw_sensor_names %}

    {% for sensor_name in sensor_names %}
        {% set motion_sensor = "filament_motion_sensor %s" % sensor_name %}
        {% set switch_sensor = "filament_switch_sensor %s" % sensor_name %}
        {% if motion_sensor in printer or switch_sensor in printer %}
            SET_FILAMENT_SENSOR SENSOR="{sensor_name}" ENABLE={enable}
        {% endif %}
    {% endfor %}


[gcode_macro _KLIPPAIN_DISABLE_FILAMENT_SENSORS]
description: Temporarily disable configured filament sensors and remember their previous state
gcode:
    {% set state = printer["gcode_macro _KLIPPAIN_FILAMENT_SENSOR_STATE"] %}
    {% set depth = state.disable_depth|int %}

    {% if depth == 0 %}
        {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
        {% set raw_sensor_names = vars.filament_sensor_names|default(["runout_sensor"]) %}
        {% set sensor_names = [raw_sensor_names] if raw_sensor_names is string else raw_sensor_names %}
        {% set enabled_sensors = namespace(names=[]) %}

        {% for sensor_name in sensor_names %}
            {% set motion_sensor = "filament_motion_sensor %s" % sensor_name %}
            {% set switch_sensor = "filament_switch_sensor %s" % sensor_name %}
            {% if motion_sensor in printer and printer[motion_sensor].enabled %}
                {% set enabled_sensors.names = enabled_sensors.names + [sensor_name] %}
            {% elif switch_sensor in printer and printer[switch_sensor].enabled %}
                {% set enabled_sensors.names = enabled_sensors.names + [sensor_name] %}
            {% endif %}
        {% endfor %}

        SET_GCODE_VARIABLE MACRO=_KLIPPAIN_FILAMENT_SENSOR_STATE VARIABLE=enabled_before_disable VALUE='"{enabled_sensors.names|join(",")}"'
        _KLIPPAIN_SET_FILAMENT_SENSORS ENABLE=0
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_KLIPPAIN_FILAMENT_SENSOR_STATE VARIABLE=disable_depth VALUE={depth + 1}


[gcode_macro _KLIPPAIN_ENABLE_FILAMENT_SENSORS]
description: Re-enable filament sensors disabled by _KLIPPAIN_DISABLE_FILAMENT_SENSORS
gcode:
    {% set state = printer["gcode_macro _KLIPPAIN_FILAMENT_SENSOR_STATE"] %}
    {% set depth = state.disable_depth|int %}

    {% if depth <= 1 %}
        {% set enabled_sensor_names = state.enabled_before_disable.split(",") if state.enabled_before_disable else [] %}

        {% for sensor_name in enabled_sensor_names %}
            {% if sensor_name %}
                SET_FILAMENT_SENSOR SENSOR="{sensor_name}" ENABLE=1
            {% endif %}
        {% endfor %}

        SET_GCODE_VARIABLE MACRO=_KLIPPAIN_FILAMENT_SENSOR_STATE VARIABLE=enabled_before_disable VALUE='""'
        SET_GCODE_VARIABLE MACRO=_KLIPPAIN_FILAMENT_SENSOR_STATE VARIABLE=disable_depth VALUE=0
    {% else %}
        SET_GCODE_VARIABLE MACRO=_KLIPPAIN_FILAMENT_SENSOR_STATE VARIABLE=disable_depth VALUE={depth - 1}
    {% endif %}
