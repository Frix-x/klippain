[gcode_macro _CG28]
description: Homing only if necessary
gcode:
    {% set status_leds_control_enabled = printer["gcode_macro _USER_VARIABLES"].status_leds_control_enabled|default(False) %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        {% if status_leds_control_enabled %}
            STATUS_LEDS COLOR="HOMING"
        {% endif %}
        G28
        {% if status_leds_control_enabled %}
            STATUS_LEDS COLOR="READY"
        {% endif %}  
    {% endif %}


[gcode_macro _HOMING_Z_THERMAL_ADJUST]
description: Suspend z_thermal_adjust while axes are unhomed and restore it afterwards
variable_suspended: False
gcode:
    {% set action = params.ACTION|default("")|lower %}

    {% if "z_thermal_adjust" in printer %}
        {% if action == "suspend" %}
            # Z is unhomed during a full G28, so the transform must not add Z to XY moves.
            # With Z already homed those moves are valid, so leave the module alone.
            # Keep the saved state if an earlier homing was interrupted while suspended.
            {% if 'z' not in printer.toolhead.homed_axes and printer.z_thermal_adjust.enabled and not printer["gcode_macro _HOMING_Z_THERMAL_ADJUST"].suspended %}
                SET_GCODE_VARIABLE MACRO=_HOMING_Z_THERMAL_ADJUST VARIABLE=suspended VALUE=True
                SET_Z_THERMAL_ADJUST ENABLE=0
            {% endif %}
        {% elif action == "resume" %}
            {% if printer["gcode_macro _HOMING_Z_THERMAL_ADJUST"].suspended and 'z' in printer.toolhead.homed_axes %}
                SET_GCODE_VARIABLE MACRO=_HOMING_Z_THERMAL_ADJUST VARIABLE=suspended VALUE=False
                SET_Z_THERMAL_ADJUST ENABLE=1
            {% endif %}
        {% else %}
            { action_raise_error("_HOMING_Z_THERMAL_ADJUST requires ACTION=suspend or ACTION=resume") }
        {% endif %}
    {% endif %}
