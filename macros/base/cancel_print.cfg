[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Cancel the print, retract 10mm of filament and park
gcode:
    {% set turn_off_heaters_in_end_print = printer["gcode_macro _USER_VARIABLES"].turn_off_heaters_in_end_print %}
    {% set safe_extruder_temp = printer["gcode_macro _USER_VARIABLES"].safe_extruder_temp|float %}
    {% set light_intensity_end_print = printer["gcode_macro _USER_VARIABLES"].light_intensity_end_print %}
    {% set klippain_mmu_enabled = printer["gcode_macro _USER_VARIABLES"].klippain_mmu_enabled %}
    {% set mmu_unload_on_cancel_print = printer["gcode_macro _USER_VARIABLES"].mmu_unload_on_cancel_print %}
    {% set filter_enabled = printer["gcode_macro _USER_VARIABLES"].filter_enabled %}
    {% set light_enabled = printer["gcode_macro _USER_VARIABLES"].light_enabled %}
    {% set status_leds_control_enabled = printer["gcode_macro _USER_VARIABLES"].status_leds_control_enabled|default(False) %}
    {% set bed_mesh_enabled = printer["gcode_macro _USER_VARIABLES"].bed_mesh_enabled %}
    {% set filament_sensor_enabled = printer["gcode_macro _USER_VARIABLES"].filament_sensor_enabled|default(False) %}
    {% set filter_default_time = printer["gcode_macro _USER_VARIABLES"].filter_default_time_on_end_print|default(600)|int %}
    {% set hotend_fan_tach_enabled = printer["gcode_macro _USER_VARIABLES"].hotend_fan_tach_enabled|default(False) %}
    {% set aux_fan_enabled = printer["gcode_macro _USER_VARIABLES"].aux_fan_enabled|default(False) %}
    {% set aux_fan_tach_enabled = printer["gcode_macro _USER_VARIABLES"].aux_fan_tach_enabled|default(False) %}
    {% set aux_fan_speed_on_end_print = printer["gcode_macro _USER_VARIABLES"].aux_fan_speed_on_end_print|default(100)|int %}
    {% set aux_fan_time_on_end_print = printer["gcode_macro _USER_VARIABLES"].aux_fan_time_on_end_print|default(300)|int %}
    {% set retract_length = printer["gcode_macro _USER_VARIABLES"].retract_length|default(20)|float %}
    
    {% if printer.toolhead.homed_axes == "xyz" %}
        PARK
    {% endif %}

    {% if klippain_mmu_enabled and mmu_unload_on_cancel_print %}
        {% if printer.mmu.enabled and printer.mmu.tool|int != -2 %}
            # Unload filament and park the MMU
            MMU_UNLOAD
        {% endif %}
    {% elif printer.extruder.can_extrude %}
        # Pull back the filament a little bit
        G92 E0
        G1 E-{retract_length} F2100
    {% endif %}

    {% if turn_off_heaters_in_end_print %}
        TURN_OFF_HEATERS
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={safe_extruder_temp}
    {% endif %}

    {% if hotend_fan_tach_enabled %}
        UPDATE_DELAYED_GCODE ID=_BACKGROUND_HOTEND_TACHO_CHECK DURATION=0
    {% endif %}

    {% if aux_fan_tach_enabled %}
        UPDATE_DELAYED_GCODE ID=_BACKGROUND_AUX_TACHO_CHECK DURATION=0
    {% endif %}

    M107
    M400

    CLEAR_PAUSE

    {% if bed_mesh_enabled %}
        BED_MESH_CLEAR
    {% endif %}

    SDCARD_RESET_FILE

    # If a filter is connected, and used during the print, continue filtering the air
    # for a couple of min before stopping everything
    {% if filter_enabled %}
        {% if printer['fan_generic filter'].speed > 0 %}
            {% set FILTER_TIME = params.FILTER_TIME|default(filter_default_time)|int %}
            START_FILTER SPEED=1
            UPDATE_DELAYED_GCODE ID=_STOP_FILTER_DELAYED DURATION={FILTER_TIME}
        {% endif %}
    {% endif %}

    # If an auxiliary fan is connected and enabled, keep it running after the cancel to
    # cool the bed faster and help recirculating filters/exhaust fans work faster.
    # Re-enable tach monitoring BEFORE starting the fan so it is monitored from the
    # moment it spins up (previously tach was disabled earlier in this macro and only
    # re-enabled after the fan was already running).
    {% if aux_fan_enabled %}
        {% set aux_fan_time = params.AUX_FAN_TIME|default(aux_fan_time_on_end_print)|int %}
        {% if aux_fan_tach_enabled %}
            UPDATE_DELAYED_GCODE ID=_BACKGROUND_AUX_TACHO_CHECK DURATION=1
        {% endif %}
        START_AUX_FAN SPEED={aux_fan_speed_on_end_print / 100}
        UPDATE_DELAYED_GCODE ID=_STOP_AUX_FAN_DELAYED DURATION={aux_fan_time}
    {% endif %}

    {% if light_enabled %}
        LIGHT_ON S={light_intensity_end_print}
    {% endif %}
    {% if status_leds_control_enabled %}
        STATUS_LEDS COLOR="OFF"
    {% endif %}

    {% if klippain_mmu_enabled %}
        {% if printer.mmu.enabled and printer.mmu.print_start_detection|int == 0 %}
            _MMU_PRINT_END STATE=cancelled
        {% endif %}
    {% endif %}

    # If a filament sensor is connected, re-enable it in case it was disabled during printing
    {% if filament_sensor_enabled %}
        _KLIPPAIN_SET_FILAMENT_SENSORS ENABLE=1
    {% endif %}
    
    # clear pause_next_layer and pause_at_layer as preparation for next print
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0

    BASE_CANCEL_PRINT
