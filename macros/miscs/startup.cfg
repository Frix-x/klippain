# This is a placeholder to add all the config checks
# and inits process used in Klippain

[gcode_macro _USER_VARIABLES]
variable_klippain_startup_succeeded: False
gcode: # do not remove this line

[delayed_gcode KLIPPAIN_STARTUP]
initial_duration: 1
gcode:
    _KLIPPAIN_STARTUP


[gcode_macro _KLIPPAIN_STARTUP]
gcode:
    ## Set boot logo
    {% if printer["gcode_macro _USER_VARIABLES"].minidisplay_bootlogo_enabled %}
        _INIT_BOOT_LOGO
    {% endif %}

    # Print system information using the system_info.py script to log them in the klippy.log
    RUN_SHELL_COMMAND CMD=system_info

    # Dump the MCU version to the console for the Klippy log
    _INIT_MCU_VER

    # Check if there is an extruder set
    {% set extruder_enabled = printer["gcode_macro _USER_VARIABLES"].extruder_enabled %}
    {% if not extruder_enabled %}
        { action_raise_error("Klippain need to have an extruder defined to work properly. Check your printer.cfg includes!") }
    {% endif %}

    # Check the probe configuration and compatibility with current includes
    _INIT_CHECKPROBECONF

    # Check the filament sensor configuration and compatibility with current includes
    _INIT_CHECK_FILAMENT_SENSORS

    # If an MMU/ERCF is included in Klippain, we also check that the correct HH version is installed
    {% set klippain_mmu_enabled = printer["gcode_macro _USER_VARIABLES"].klippain_mmu_enabled %}
    {% set klippain_ercf_enabled = printer["gcode_macro _USER_VARIABLES"].klippain_ercf_enabled %}
    {% if klippain_mmu_enabled or klippain_ercf_enabled %}
        _INIT_CHECK_MMU
    {% endif %}

    ## Set the startup status LED
    _INIT_LEDS

    # User custom startup process. Define them in your overrides.cfg if needed :)
    _INIT_USERCUSTOM

    {% if klippain_mmu_enabled %}
        RESPOND MSG="Klippain with MMU support started and ready!"
    {% else %}
        RESPOND MSG="Klippain started and ready!"
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_USER_VARIABLES VARIABLE=klippain_startup_succeeded VALUE=True


[gcode_macro _INIT_LEDS]
gcode:
    {% set light_enabled = printer["gcode_macro _USER_VARIABLES"].light_enabled|default(False) %}
    {% set status_leds_control_enabled = printer["gcode_macro _USER_VARIABLES"].status_leds_control_enabled|default(False) %}

    {% if light_enabled or status_leds_control_enabled %}
        {% if printer["gcode_macro _USER_VARIABLES"].caselight_on_at_startup|default(False) %}
            {% set light_intensity_startup = printer["gcode_macro _USER_VARIABLES"].light_intensity_startup|default(100) %}
            {% if light_enabled %}
                LIGHT_ON S={light_intensity_startup}
            {% endif %}
            {% if status_leds_control_enabled %}
                STATUS_LEDS COLOR="READY"
            {% endif %}
        {% else %}
            {% if light_enabled %}
                LIGHT_OFF
            {% endif %}
            {% if status_leds_control_enabled %}
                STATUS_LEDS COLOR="OFF"
            {% endif %}
        {% endif %}
    {% endif %}


[gcode_macro _INIT_CHECK_FILAMENT_SENSORS]
gcode:
    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    {% set filament_sensor_enabled = vars.filament_sensor_enabled|default(False) %}
    {% set raw_sensor_names = vars.filament_sensor_names|default(["runout_sensor"]) %}
    {% set sensor_names = [raw_sensor_names] if raw_sensor_names is string else raw_sensor_names %}
    {% set missing_sensor = namespace(name="") %}
    {% set empty_sensor_name = namespace(found=False) %}

    {% if filament_sensor_enabled %}
        {% if "_KLIPPAIN_SET_FILAMENT_SENSORS" not in printer.gcode.commands %}
            { action_raise_error("Filament sensor support is enabled but the Klippain filament sensor helper macros are missing. Include a Klippain filament sensor hardware profile or macros/hardware_functions/filament_sensors.cfg.") }
        {% endif %}
        {% if "_KLIPPAIN_DISABLE_FILAMENT_SENSORS" not in printer.gcode.commands or "_KLIPPAIN_ENABLE_FILAMENT_SENSORS" not in printer.gcode.commands %}
            { action_raise_error("Filament sensor support is enabled but the Klippain filament sensor disable/enable helpers are missing.") }
        {% endif %}

        {% for sensor_name in sensor_names %}
            {% if not sensor_name %}
                {% set empty_sensor_name.found = True %}
            {% else %}
                {% set motion_sensor = "filament_motion_sensor %s" % sensor_name %}
                {% set switch_sensor = "filament_switch_sensor %s" % sensor_name %}
                {% if motion_sensor not in printer and switch_sensor not in printer %}
                    {% set missing_sensor.name = sensor_name %}
                {% endif %}
            {% endif %}
        {% endfor %}

        {% if empty_sensor_name.found %}
            { action_raise_error("filament_sensor_names contains an empty sensor name") }
        {% endif %}
        {% if missing_sensor.name %}
            { action_raise_error("filament_sensor_names references '%s', but no matching filament_switch_sensor or filament_motion_sensor exists" % missing_sensor.name) }
        {% endif %}
    {% endif %}


[gcode_macro _INIT_CHECKPROBECONF]
gcode:
    {% set probe_type_enabled = printer["gcode_macro _USER_VARIABLES"].probe_type_enabled|string %}
    {% set zcalib_plugin_enabled = printer["gcode_macro _USER_VARIABLES"].zcalib_plugin_enabled %}
    {% set bed_mesh_enabled = printer["gcode_macro _USER_VARIABLES"].bed_mesh_enabled %}
    {% set qgl_enabled = printer["gcode_macro _USER_VARIABLES"].qgl_enabled %}
    {% set ztilt_enabled = printer["gcode_macro _USER_VARIABLES"].ztilt_enabled %}
    {% set probe_uses_virtual_z = printer["gcode_macro _USER_VARIABLES"].probe_uses_virtual_z|default(False) %}
    {% set probe_uses_nozzle_contact = printer["gcode_macro _USER_VARIABLES"].probe_uses_nozzle_contact|default(False) %}

    _INIT_CHECK_VIRTUAL_Z_PROBE

    # Check the Beacon firmware version for contact probing
    {% if probe_type_enabled == "beacon_contact" %}
        {% if 'mcu beacon' in printer %}
            {% set version = printer['mcu beacon'].mcu_version.split(' ')|last %}
            {% set major = version.split('.')|first|int %}
            {% set home_x, home_y = printer.configfile.settings.beacon.home_xy_position|map('float') %}
            {% set x_position_center = printer.toolhead.axis_maximum.x|int/2 - printer.toolhead.axis_minimum.x|int/2 %}
            {% set y_position_center = printer.toolhead.axis_maximum.y|int/2 - printer.toolhead.axis_minimum.y|int/2 %}
            {% if version < '2' %}
                {action_raise_error('Beacon firmware is too old for contact probing. Found: %s, Required: 2.0.0 or higher' % version)}
            {% endif %}
            {% if home_x == -1000 and home_y == -1000 %}
                {action_raise_error('Incomplete Beacon configuration\nhome_xy_position not set.\nPlease add the following to your "overrides.cfg": \n[beacon]\nhome_xy_position: %d,%d\n' % (x_position_center, y_position_center))}
            {% endif %}
        {% else %}
            {action_raise_error('Beacon MCU was not found')}
        {% endif %}
    {% endif %}

    {% if zcalib_plugin_enabled %}
        {% if probe_type_enabled == "none" %}
            { action_raise_error("You need a probe to use the Z calibration plugin in Klippain!") }
        {% elif probe_uses_nozzle_contact %}
            { action_raise_error("Nozzle-contact probes and Z calibration plugin cannot be used at the same time in Klippain!") }
        {% elif probe_uses_virtual_z %}
            { action_raise_error("Virtual Z endstop probes are not compatible with the Z calibration plugin!") }
        {% elif probe_type_enabled == "bltouch" %}
            { action_raise_error("BLTouch Probe and Z calibration plugin cannot be used at the same time in Klippain!") }
        {% elif probe_type_enabled == "inductive" %}
            { action_raise_error("Inductive probe and Z calibration plugin cannot be used at the same time in Klippain!") }
        {% endif %}
    {% endif %}

    {% if bed_mesh_enabled and probe_type_enabled == "none" %}
        { action_raise_error("You need a to define a probe to be able to perform a bed mesh in Klippain!") }
    {% endif %}

    {% if qgl_enabled and probe_type_enabled == "none" %}
        { action_raise_error("You need a to define a probe to be able to perform a quad gantry leveling in Klippain!") }
    {% endif %}

    {% if ztilt_enabled and probe_type_enabled == "none" %}
        { action_raise_error("You need a to define a probe to be able to perform a Z tilt adjust in Klippain!") }
    {% endif %}


[gcode_macro _INIT_CHECK_VIRTUAL_Z_PROBE]
gcode:
    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    {% set verbose = vars.verbose|default(False) %}
    {% set probe_type = vars.probe_type_enabled|string %}
    {% set valid_modes = ["none", "standard_g28", "hook"] %}
    {% set z_home_mode = vars.probe_contact_z_home_mode|default("none")|string %}
    {% set auto_cal_mode = vars.probe_contact_auto_calibrate_mode|default("none")|string %}
    {% set hook_family = vars.probe_hook_family|default("")|string %}
    {% set hook_family_allowed_chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-" %}
    {% set invalid_hook_family = namespace(found=False) %}
    {% set needs_contact_guard = vars.probe_needs_contact_temp_guard|default(False) %}

    {% if z_home_mode not in valid_modes %}
        { action_raise_error("Invalid probe_contact_z_home_mode '%s' for probe '%s'. Valid values are: none, standard_g28, hook" % (z_home_mode, probe_type)) }
    {% endif %}
    {% if auto_cal_mode not in valid_modes %}
        { action_raise_error("Invalid probe_contact_auto_calibrate_mode '%s' for probe '%s'. Valid values are: none, standard_g28, hook" % (auto_cal_mode, probe_type)) }
    {% endif %}
    {% for char in hook_family %}
        {% if char not in hook_family_allowed_chars %}
            {% set invalid_hook_family.found = True %}
        {% endif %}
    {% endfor %}
    {% if invalid_hook_family.found %}
        { action_raise_error("Invalid probe_hook_family '%s' for probe '%s'. Use an empty value or a simple slug with only letters, digits, underscore, and hyphen, such as beacon_contact" % (hook_family, probe_type)) }
    {% endif %}
    {% if hook_family and z_home_mode == "none" and auto_cal_mode == "none" %}
        { action_raise_error("Probe '%s' sets probe_hook_family='%s' but all contact operation modes are none" % (probe_type, hook_family)) }
    {% endif %}
    {% if z_home_mode == "hook" and "_PROBE_HOOK_CONTACT_Z_HOME" not in printer.gcode.commands %}
        { action_raise_error("Probe '%s' uses hook contact Z home but _PROBE_HOOK_CONTACT_Z_HOME is missing" % probe_type) }
    {% endif %}
    {% if auto_cal_mode == "hook" and "_PROBE_HOOK_CONTACT_AUTO_CALIBRATE" not in printer.gcode.commands %}
        { action_raise_error("Probe '%s' uses hook contact auto-calibrate but _PROBE_HOOK_CONTACT_AUTO_CALIBRATE is missing" % probe_type) }
    {% endif %}
    {% if hook_family and needs_contact_guard and "_PROBE_HOOK_CONTACT_ACTIVATE" not in printer.gcode.commands %}
        { action_raise_error("Probe '%s' uses hook family '%s' with contact guard but _PROBE_HOOK_CONTACT_ACTIVATE is missing" % (probe_type, hook_family)) }
    {% endif %}
    {% if hook_family and needs_contact_guard and "_PROBE_HOOK_CONTACT_DEACTIVATE" not in printer.gcode.commands %}
        { action_raise_error("Probe '%s' uses hook family '%s' with contact guard but _PROBE_HOOK_CONTACT_DEACTIVATE is missing" % (probe_type, hook_family)) }
    {% endif %}

    {% if vars.probe_contact_max_temp is defined %}
        {% if probe_type == "vorontap" and vars.tap_max_probing_temp is defined and vars.probe_contact_max_temp|float != vars.tap_max_probing_temp|float and verbose %}
            RESPOND MSG="probe_contact_max_temp overrides tap_max_probing_temp for Voron TAP"
        {% elif probe_type == "beacon_contact" and vars.beacon_max_probing_temp is defined and vars.probe_contact_max_temp|float != vars.beacon_max_probing_temp|float and verbose %}
            RESPOND MSG="probe_contact_max_temp overrides beacon_max_probing_temp for Beacon Contact"
        {% endif %}
    {% endif %}


[gcode_macro _INIT_MCU_VER]
gcode:
    {% set parameters = namespace(output = 'Currently configured MCU(s): \n') %}
    {% for name1 in printer %}
        {% for name2 in printer[name1] %}
        {% set show = ['mcu_version'] %}
        {% if name2 is in show %}
            {% set param = "%s: %s" % (name1, printer[name1][name2]) %}
            {% set parameters.output = parameters.output +  param + "\n" %}
        {% endif %}
        {% endfor %}
    {% endfor %}
    {action_respond_info(parameters.output)}


[gcode_macro _INIT_CHECK_MMU]
gcode:
    {% if printer.mmu is not defined %}
        {% if printer.ercf is not defined %}
            { action_raise_error("MMU support is enabled in Klippain, but HappyHare, the supported MMU/ERCF backend software is not detected. See the corresponding documentation: https://github.com/Frix-x/klippain/blob/main/docs/mmu.md") }
        {% else %}
            { action_raise_error("ERCF support is enabled in Klippain, but the old version of version of HappyHare (ie. ERCF-Software-V3) is installed. Please uninstall it and install the latest HappyHare instead. See the corresponding documentation: https://github.com/Frix-x/klippain/blob/main/docs/mmu.md") }
        {% endif %}
    {% elif printer['gcode_macro _USER_VARIABLES'].mmu_force_homing_in_start_print is not defined or printer['gcode_macro _USER_VARIABLES'].mmu_unload_on_cancel_print is not defined or printer['gcode_macro _USER_VARIABLES'].mmu_unload_on_end_print is not defined or printer['gcode_macro _USER_VARIABLES'].mmu_check_gates_on_start_print is not defined or printer['gcode_macro _USER_VARIABLES'].mmu_check_errors_on_start_print is not defined %}
        { action_raise_error("MMU support is enabled in Klippain, but some variables are missing from your variables.cfg. Please update your template or refer to the corresponding documentation: https://github.com/Frix-x/klippain/blob/main/docs/mmu.md") }
    {% elif printer["gcode_macro _USER_VARIABLES"].mmu_check_errors_on_start_print and printer.mmu.print_start_detection|int == 1 %}
        RESPOND MSG="The HappyHare function to automatically detect the start and end of a print has been automatically disabled to allow early detection of an error during the Klippain START_PRINT sequence. This allow a more efficient debugging of the MMU. Refer to the <a href="https://github.com/Frix-x/klippain/blob/main/docs/mmu.md">Klippain MMU documentation</a>"
        MMU_TEST_CONFIG print_start_detection=0 # Override this value to disable the HappyHare auto detection of start and end of print in order to call _MMU_PRINT_START and _MMU_PRINT_END manually
    {% endif %}


[gcode_macro _INIT_USERCUSTOM]
gcode:
    # ---- CUSTOM Macro section
    # this section is reserved for personal customized user startup
    # in order to use this, create a new macro in your overrides.cfg
    # [gcode_macro _INIT_USERCUSTOM]
    # gcode:
    #   ## Your custom code here
