[include ../hardware/lights/config_colors.cfg]

[gcode_macro _HOTKEY_SET_BUTTON_COLOR]
description: Set the LEDs associated with one button
gcode:
    {% set button = params.BUTTON|int %}
    {% set color_name = params.COLOR|lower %}
    {% set colors = printer["gcode_macro _LEDS_COLORS_DEFINITION"].colors.logo %}
    {% set color = colors[color_name] %}
    {% set led = printer["gcode_macro _USER_VARIABLES"].button_led_name %}
    {% set indices = printer["gcode_macro _USER_VARIABLES"].button_led_indices[button|string].split(',') %}
    {% for index in indices %}
        {% set transmit = 1 if loop.last else 0 %}
        SET_LED LED={led} RED={color.r} GREEN={color.g} BLUE={color.b} WHITE={color.w|default(0)} INDEX={index} TRANSMIT={transmit}
    {% endfor %}

[gcode_macro _HOTKEY_BUTTON]
description: Dispatch a button action
gcode:
    {% set button = params.BUTTON|default('')|upper %}
    {% set hook = '_HOTKEY_BUTTON_' + button %}
    {% if hook in printer.gcode.commands %}
        _HOTKEY_SET_BUTTON_COLOR BUTTON={button[1:]} COLOR=busy
        { hook }
        _HOTKEY_SET_BUTTON_COLOR BUTTON={button[1:]} COLOR=standby
    {% else %}
        RESPOND MSG="Button {button} is not mapped"
    {% endif %}
