# Secondary part cooling fan with tachometer monitoring (requires an AUX_FAN_TACHO pin, e.g. Fysetc H36/SB Combo)
# Use this file instead of aux_fan.cfg
[gcode_macro _USER_VARIABLES]
variable_aux_fan_enabled: True
variable_aux_fan_name: "aux_fan"
variable_aux_fan_tach_enabled: True
variable_aux_fan_tach_poll_interval: 3 # seconds between tachometer safety checks
gcode:

# Also include directly the auxiliary fan control macros from here
[include ../../../macros/hardware_functions/aux_fan.cfg]

[fan_generic aux_fan]
pin: AUX_FAN
tachometer_pin: AUX_FAN_TACHO
# Wired to the main MCU: define "AUX_FAN=<pin>" and "AUX_FAN_TACHO=<pin>" in your
# main mcu.cfg, or replace the pins with the raw main-board pins.
