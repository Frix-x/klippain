# Secondary part cooling fan, independently controlled (e.g. OrcaSlicer "Auxiliary Part Cooling Fan")
[gcode_macro _USER_VARIABLES]
variable_aux_fan_enabled: True
variable_aux_fan_name: "aux_fan"
gcode:

# Also include directly the auxiliary fan control macros from here
[include ../../../macros/hardware_functions/aux_fan.cfg]

[fan_generic aux_fan]
pin: AUX_FAN
# Wired to the main MCU: define "AUX_FAN=<pin>" in your main mcu.cfg,
# or replace this pin with the raw main-board pin (e.g. PB6).
