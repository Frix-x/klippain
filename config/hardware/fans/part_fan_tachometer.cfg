[gcode_macro _USER_VARIABLES]
variable_part_fan_tach_enabled: True
gcode:

[fan]
pin: PART_FAN
kick_start_time: 0.100
cycle_time: 0.010
tachometer_pin: PART_FAN_TACHO

# OrcaSlicer M106 P2 / M107 P2 bridge for the auxiliary fan (only effective when an aux fan is configured).
# Uses rename_existing, so it must be included alongside a [fan] section (like this file).
[include ../../../macros/hardware_functions/fan_bridge.cfg]

# And we also include the tachometer check macros from here
[include ../../../macros/helpers/tachometer_check.cfg]
