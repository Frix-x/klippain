[gcode_macro _USER_VARIABLES]
variable_filament_sensor_enabled: True
variable_filament_sensor_names: "runout_sensor", "motion_sensor"
gcode:

[include ../../../macros/hardware_functions/filament_sensors.cfg]


[filament_switch_sensor runout_sensor]
switch_pin: RUNOUT_SENSOR
pause_on_runout: True


[filament_motion_sensor motion_sensor]
switch_pin: MOTION_SENSOR
detection_length: 7.0
extruder: extruder
pause_on_runout: False
runout_gcode:
    RESPOND MSG="Filament motion stopped; possible clog or tangle detected"
    PAUSE
