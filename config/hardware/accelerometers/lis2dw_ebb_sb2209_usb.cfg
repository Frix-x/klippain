# This LIS2DW file is dedicated to be used with the built-in accelerometer
# on BTT EBB SB2209 USB boards.

[lis2dw]
cs_pin: toolhead:LIS2DW_CS
spi_bus: spi0a
axes_map: z,x,y

[resonance_tester]
accel_chip: lis2dw
probe_points:
    -1,-1,-1


# Include the IS calibration macros to unlock them when
# an accelerometer is installed on the machine
[include ../../../macros/helpers/resonance_override.cfg]
[include ../../../scripts/K-ShakeTune/K-SnT_*.cfg]
