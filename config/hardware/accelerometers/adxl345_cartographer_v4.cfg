# This ADXL file is dedicated to the built-in ADXL345 on Cartographer V4 probes.
# Select only the file matching your Cartographer version. Using the wrong
# Cartographer ADXL CS pin can cause an endless boot loop.

[adxl345]
cs_pin: cartographer:PA0
spi_bus: spi1
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345
probe_points:
    -1,-1,-1


# Include the IS calibration macros to unlock them when
# an accelerometer is installed on the machine
[include ../../../macros/helpers/resonance_override.cfg]
[include ../../../scripts/K-ShakeTune/K-SnT_*.cfg]
