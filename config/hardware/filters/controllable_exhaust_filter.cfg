# Controllable exhaust fan (variable speed, e.g. a PWM exhaust blower)
# Unlike exhaust_filter.cfg (a thermostatic heater_fan tied to the bed), this
# exhaust is driven by the print macros: started with a material-specific speed
# during the print and kept running for a while after the print to clear the air.
[gcode_macro _USER_VARIABLES]
variable_exhaust_enabled: True
variable_exhaust_name: "exhaust"
gcode:

# Also include directly the exhaust control macros from here
[include ../../../macros/hardware_functions/exhaust.cfg]


[fan_generic exhaust]
pin: EXHAUST_FAN
max_power: 1.0
kick_start_time: 0.250
off_below: 0.30
# hardware_pwm: True
# cycle_time: 0.001
